name: Deploy on Demand
on:
  deployment:
permissions:
  contents: read
  deployments: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - name: Show context
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "deployment.ref=${{ github.event.deployment.ref }}"
          echo "deployment.sha=${{ github.event.deployment.sha }}"
          echo "--- tree at checkout ---"
          ls -R .github/ || true
      - name: Run composite deploy step (loaded from deployment ref tree)
        if: hashFiles('.github/actions/deploy-step/action.yml') != ''
        uses: ./.github/actions/deploy-step
      - name: Run any deploy script the checkout brought
        run: |
          if [[ -f deploy.sh ]]; then
            bash deploy.sh
          else
            echo "no deploy.sh"
          fi
